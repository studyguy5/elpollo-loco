<!DOCTYPE html>
<html lang="sp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pollo Loco</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./gameInfo.css">
    <link rel="icon" href="./img/favicon.png" type="image">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap');
    </style>
</head>

<script>

    document.addEventListener('contextmenu', (e) => {
        if (e.pointerType === 'touch') {  // ✅ nur bei Touch
            e.preventDefault();
        }
    });

</script>

<body onload="init()">
    <h1>El pollo Loco</h1>
    <h2>Hello let's play</h2>
    <div class="mobileDeviceInfo" id="mobileDeviceInfo"><img src="./img/mobile_device_info.png"></div>
    <div class="canvaAria" id="canvaAria">
        <div class="startMask" id="startMask"></div>
        <div class="endMask" id="endMask"></div>
        <div class="controlHudCharacter" id="controlHudCharacter"></div>
        <div class="controlHudSound" id="controlHudSound"></div>
        <canvas id="gameCanvas" width="720" height="480">
        </canvas>
    </div>
    <div class="closeDiv" id="closeDiv" onclick="makeInfoVisible()"></div>
    <div class="infoDiv" id="infoDiv"></div>
    <div class="userInfo" id="userInfo">
        <p id="Jump">Jump = Space</p>
        <p id="LeftRight">Move = Arrow Left or Right</p>
        <p id="Shoot">Shoot Bottle = D</p>
    </div>


</body>
<script src="./js/stopInterval.js"></script>
<script src="./models/startScreen.class.js"></script>
<script src="./models/drawableobject.class.js"></script>
<script src="./models/movable-object.class.js"></script>
<script src="./models/character.class.js"></script>

<script src="./models/chicken.class.js"></script>
<script src="./models/clouds.class.js"></script>

<script src="./models/bottlesOnFloorObject.class.js"></script>
<script src="./models/world.class.js"></script>
<script src="./models/endScreen.class.js"></script>
<script src="./models/miniChicken.class.js"></script>
<script src="./models/background-objects.class.js"></script>
<script src="./models/keyboard.class.js"></script>
<script src="./models/endboss.class.js"></script>
<script src="./models/worldClassExtention.js"></script>
<script src="./models/level.class.js"></script>
<script src="./levels/level1.js"></script>
<script src="./js/game_Fullscreen.js"></script>
<script src="./js/game.js"></script>
<script src="./js/keyEvent.js"></script>

</html>
